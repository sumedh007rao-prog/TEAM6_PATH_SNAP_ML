<!doctype html>
<html><head><meta charset="utf-8"><title>PathSnap</title>
<style>
 body{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 16px}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
 a.btn{display:block;padding:12px;border:1px solid #3a6;border-radius:6px;text-align:center;
       text-decoration:none;color:#063;background:#f3fbf5}
 a.btn:hover{background:#dff3e5} small{color:#666}
</style></head><body>
<h1>PathSnap</h1>
<p>Select a trip to reconstruct. <small>API: {{ api_url }} &middot; partition: {{ partition }}</small></p>
<div class="grid">
{% for t in trips %}<a class="btn" href="{{ url_for('trip', trip_id=t) }}">Trip {{ t }}</a>{% endfor %}
</div>
{% if not trips %}<p>The API returned no trips.</p>{% endif %}
</body></html>
